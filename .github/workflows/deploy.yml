name: Deploy Site 6 to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/site-6
            git pull origin main
            npm install
            pm2 restart site-6-pontosfelmeres || PORT=6000 pm2 start npm --name "site-6-pontosfelmeres" --cwd /var/www/site-6 -- run start
            pm2 save
