# Külön server blokk a pontosfelmeres.hu-hoz.
# A 6000-es port csak ezt az alkalmazást szolgálja ki.
# A www cím 301-gyel az apexre megy, a canonical is az apex.

server {
    listen 80;
    listen [::]:80;
    server_name www.pontosfelmeres.hu;
    return 301 http://pontosfelmeres.hu$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name pontosfelmeres.hu;

    location / {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TLS után a proxy_pass ugyanaz marad, a www blokk pedig
# return 301 https://pontosfelmeres.hu$request_uri;
# Az alkalmazás .env fájljában ilyenkor:
# SITE_URL=https://pontosfelmeres.hu
# TRUST_PROXY=1
# A TRUST_PROXY=1 csak akkor biztonságos, ha a 6000 kívülről nem érhető el.
