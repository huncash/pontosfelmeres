services:
  pontosfelmeres:
    build: .
    container_name: pontosfelmeres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "6000"
      DATA_FILE: /app/data/leads.sqlite
      NODE_ENV: production
    ports:
      - "6000:6000"
    volumes:
      - pf_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pf_data:
    name: pontosfelmeres_data
